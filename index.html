<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>南浦云工具箱</title>
  </head>
  <body>
    <header>
      <h1>🧰 南浦云工具箱</h1>
      <p>本地运行 · 文件不上传服务器 · 保护隐私</p>
    </header>
    <nav id="nav">
      <button data-tool="image" class="active">图片</button>
      <button data-tool="video">视频</button>
      <button data-tool="audio">音频</button>
      <button data-tool="docs">文档与文件</button>
    </nav>
    <main id="tool"></main>
    <footer>
      <p>v0.1.0 · 图片 / 视频 / 音频 / 文档与文件 · 全部在本地浏览器 / WebView 里处理</p>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
